# 📦 SevaLekh: the day's MukhWak pictures and videos, made every morning (India time)
# and published on GitHub Pages. Free for public repositories. See README.md.
name: Daily MukhWak media

on:
  schedule:
    # A quick check (a few seconds, no installs) every 15 minutes from 05:15 to
    # 12:45 India time; the slow build runs only once today's text and audio are
    # up and not yet published. GitHub often starts scheduled runs late or skips
    # a slot when busy, so many cheap checks make the morning video dependable.
    # (Edmonton: 17:45–01:15 the evening before, summer time.)
    - cron: '45 23 * * *'          # 05:15 India
    - cron: '*/15 0-6 * * *'       # 05:30–12:45 India
    - cron: '7,22,37,52 0-3 * * *' # extra slots off the busy quarter-hours
    # The rest of India's day, hourly: remakes the media if today's meanings
    # were edited or approved after the morning run (a few seconds otherwise).
    - cron: '20 7-17 * * *'        # 12:50–23:50 India
  workflow_dispatch:
    inputs:
      force:
        description: 'Make again even if today''s are already published'
        type: boolean
        default: false
      post:
        description: 'Also post to Telegram (if set up — see SOCIAL-AUTOPOST.md)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.check.outputs.go }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: node check.mjs
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE: ${{ inputs.force && '1' || '' }}
          AUDIO_RELAY: ${{ vars.AUDIO_RELAY || '' }}

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      skip: ${{ steps.make.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - id: make
        run: node make.mjs
        env:
          APP_URL: ${{ vars.APP_URL || 'https://granth.web.app' }}
          LANGS: ${{ vars.LANGS || 'pa,en,pnb,hi' }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Made again because today's meanings changed: same as a forced run.
          FORCE: ${{ (inputs.force || needs.check.outputs.reason == 'edited') && '1' || '' }}
          AUDIO_RELAY: ${{ vars.AUDIO_RELAY || '' }}
          # Optional Telegram channel posts (SOCIAL-AUTOPOST.md): scheduled runs, or "post" ticked.
          # Only the morning's first build posts; a remake after edits doesn't post again.
          POST: ${{ ((github.event_name == 'schedule' && needs.check.outputs.reason == 'new') || inputs.post) && '1' || '' }}
          # Repository *secrets* (best); repository variables are accepted too.
          # (TG_MUKHWAK_BOT_TOKEN / MUKHWAK_CH: the names first used on this repository.)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_MUKHWAK_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          # The channel isn't secret: a plain variable (e.g. @mukhwaak) is easiest to check, so it comes first.
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.MUKHWAK_CH || vars.MUKHWAK_CH }}
          TELEGRAM_TOKEN_IN_VARS: ${{ secrets.TELEGRAM_BOT_TOKEN == '' && secrets.TG_MUKHWAK_BOT_TOKEN == '' && vars.TELEGRAM_BOT_TOKEN != '' && '1' || '' }}
          TELEGRAM_LANG: ${{ vars.TELEGRAM_LANG || '' }}
          TELEGRAM_VIDEO: ${{ vars.TELEGRAM_VIDEO || '' }}
          TELEGRAM_TEXT: ${{ vars.TELEGRAM_TEXT || '' }}
      - if: steps.make.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
